<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ec">

<title>TapChat</title>

<link
    rel="icon"
    href="favicon-dark.png"
    media="(prefers-color-scheme: light)"
>
<link
    rel="icon"
    href="favicon-light.png"
    media="(prefers-color-scheme: dark)"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@materialwebunofficial/md3e-web/dist/tokens.min.css"
>
<script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@materialwebunofficial/md3e-web/dist/md3-expressive.esm.js">
</script>

<style>
:root {
    color-scheme: light;
    --page-bg: var(--md-sys-color-background, #F9F7FF);
    --page-fg: var(--md-sys-color-on-background, #1A1B20);
    --muted: var(--md-sys-color-on-surface-variant, #45464F);
    --surface: var(--md-sys-color-surface-container, #EDEDF5);
    --line: var(--md-sys-color-outline-variant, #C5C6D0);
    --shadow: 0 18px 60px rgba(40, 43, 60, .08);
}

:root[data-theme="dark"] {
    color-scheme: dark;
    --page-bg: var(--md-sys-color-background, #111318);
    --page-fg: var(--md-sys-color-on-background, #E2E2E9);
    --muted: var(--md-sys-color-on-surface-variant, #C5C6D0);
    --surface: var(--md-sys-color-surface-container, #1D1F26);
    --line: var(--md-sys-color-outline-variant, #45464F);
    --shadow: 0 18px 60px rgba(0, 0, 0, .24);
}

* {
    box-sizing: border-box;
}

html {
    height: 100%;
    background: #F9F7FF;
}

body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: Arial, sans-serif;
    transition: background .35s, color .35s;
    opacity: 0;
    visibility: hidden;
}

body.theme-ready {
    opacity: 1;
    visibility: visible;
    transition: opacity .18s ease;
}

md-expressive-theme {
    display: contents;
}

#scroller {
    height: 100vh;
    height: 100svh;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

#scroller::-webkit-scrollbar {
    display: none;
}

.page-section {
    position: relative;
    isolation: isolate;
    display: grid;
    place-items: safe center;

    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 100vh;
    min-height: 100svh;

    padding: 88px clamp(20px, 6vw, 88px) 42px;

    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    scrollbar-width: none;

    scroll-snap-align: start;
    scroll-snap-stop: always;
}

.page-section::-webkit-scrollbar {
    display: none;
}

.page-section::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
        ellipse at 50% 45%,
        color-mix(
            in srgb,
            var(--md-sys-color-primary, #526A92) 8%,
            transparent
        ),
        transparent 65%
    );
    opacity: .8;
}

.topbar {
    position: fixed;
    z-index: 20;
    top: 16px;
    right: clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
}

.topbar md-button {
    --md-sys-typescale-label-large-size: 13px;
}

.section-inner {
    width: min(1040px, 100%);
    max-height: none;
    overflow: visible;
    text-align: center;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition:
        opacity .55s ease,
        transform .7s cubic-bezier(.2, .8, .2, 1);
}

.page-section.active .section-inner {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.brand-mark {
    width: clamp(160px, 26vw, 280px);
    height: clamp(160px, 26vw, 280px);
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
}

.brand-mark img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.brand-fallback {
    width: 100%;
    height: 100%;
}

h1 {
    margin: 0;
    font-size: clamp(42px, 7vw, 76px);
    letter-spacing: -.055em;
    font-weight: 700;
}

.subtitle {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: clamp(17px, 2.4vw, 23px);
}

.eyebrow {
    margin: 0 0 12px;
    color: var(--md-sys-color-primary, #526A92);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
}

h2 {
    margin: 0 0 20px;
    font-size: clamp(30px, 4.5vw, 50px);
    line-height: 1.08;
    letter-spacing: -.04em;
}

.copy {
    max-width: 760px;
    margin: 0 auto;
    color: var(--muted);
    font-size: clamp(16px, 1.7vw, 19px);
    line-height: 1.75;
}

.hero-actions {
    margin-top: 28px;
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 20px;
    text-align: left;
}

md-card.feature {
    display: block;
    min-height: 150px;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 28px;
    color: var(--page-fg);
    background: var(--surface);
    box-shadow: 0 0 0 transparent;
    transition:
        box-shadow .4s ease,
        transform .25s ease,
        background .3s ease;
}

md-card.feature:hover {
    box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
    transform: translateY(-4px);
}

.feature-icon {
    display: grid;
    width: 34px;
    height: 34px;
    margin-bottom: 18px;
    place-items: center;
    color: var(--md-sys-color-primary, #526A92);
    transform: translateY(10px);
}

.feature-grid md-card.feature:nth-child(3) .feature-icon {
    transform: translateY(6px);
}

.feature-icon svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.feature h3 {
    margin: 0 0 8px;
    font-size: 19px;
}

.feature p {
    margin: 0;
    color: var(--muted);
    line-height: 1.55;
}

.download-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.download-version {
    margin: 12px 0 24px;
    color: var(--muted);
    font-size: 14px;
}

.download-note {
    margin: 0;
    color: var(--muted);
}

.footer {
    position: absolute;
    bottom: 18px;
    color: var(--muted);
    font-size: 12px;
}

@media (max-width: 650px) {
    .page-section {
        padding: 82px 20px 50px;
    }

    .brand-mark {
        width: clamp(150px, 42vw, 220px);
        height: clamp(150px, 42vw, 220px);
    }

    .feature-grid {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 18px;
    }

    md-card.feature {
        min-height: 0;
        padding: 17px 19px;
    }

    .feature-icon {
        display: none;
    }

    .feature h3 {
        margin-bottom: 5px;
        font-size: 16px;
    }

    .feature p {
        font-size: 14px;
    }

    .section-inner.features-inner {
        max-width: 490px;
    }
}

@media (max-height: 650px) {
    .page-section {
        padding-top: 66px;
        padding-bottom: 40px;
    }

    .brand-mark {
        width: 130px;
        height: 130px;
        margin-bottom: 8px;
    }

    .feature-grid {
        gap: 8px;
        margin-top: 12px;
    }

    md-card.feature {
        min-height: 0;
        padding: 13px 16px;
    }

    .feature-icon {
        display: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
</head>

<body>
<md-expressive-theme
    id="m3eTheme"
    global
    primary-seed="#526A92"
    color-mode="light"
    palette-variant="tonal-spot">
</md-expressive-theme>

<header class="topbar" aria-label="Site controls">
    <md-button id="langRu" variant="tonal" label="RU"></md-button>
    <md-button id="langEn" variant="text" label="EN"></md-button>
    <md-button
        id="themeToggle"
        variant="tonal"
        icon="dark_mode"
        label="Тёмная тема">
    </md-button>
</header>

<main id="scroller" aria-label="TapChat">
    <section class="page-section active" data-page="0" aria-label="TapChat">
        <div class="section-inner">
            <div class="brand-mark">
                <img
                    src="logo.png"
                    alt="TapChat"
                    onerror="this.hidden=true;this.nextElementSibling.hidden=false">

                <svg
                    class="brand-fallback"
                    hidden
                    viewBox="0 0 200 200"
                    role="img"
                    aria-label="TapChat logo">
                    <path
                        d="M100 16c-36 0-65 29-65 65v38c0 28 22 50 50 50h10l25 19v-22c27-8 46-33 46-62V81c0-36-29-65-66-65Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="9"
                        stroke-linejoin="round"/>
                    <path
                        d="M78 78v41m22-55v60m22-49v39"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="11"
                        stroke-linecap="round"/>
                </svg>
            </div>

            <h1>TapChat</h1>
            <p id="subtitle" class="subtitle">Проще, чем кажется.</p>

            <div class="hero-actions">
                <md-button
                    id="heroNext"
                    variant="filled"
                    icon="arrow_downward"
                    label="Узнать больше">
                </md-button>
            </div>
        </div>
    </section>

    <section class="page-section" data-page="1" aria-label="About TapChat">
        <div class="section-inner">
            <p class="eyebrow" id="aboutEyebrow">О проекте</p>
            <h2 id="aboutTitle">Что такое TapChat?</h2>
            <p id="aboutDesc" class="copy"></p>

            <div class="hero-actions">
                <md-button
                    class="next-page"
                    data-next="2"
                    variant="outlined"
                    icon="arrow_downward"
                    label="Преимущества">
                </md-button>
            </div>
        </div>
    </section>

    <section class="page-section" data-page="2" aria-label="Features">
        <div class="section-inner features-inner">
            <p class="eyebrow" id="featuresEyebrow">Особенности</p>
            <h2 id="why">Почему TapChat?</h2>

            <div class="feature-grid">
                <md-card class="feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3 20 6v5c0 5.2-3.4 8.7-8 10-4.6-1.3-8-4.8-8-10V6l8-3Z"/>
                            <path d="m8.5 12 2.2 2.2 4.8-4.8"/>
                        </svg>
                    </div>
                    <h3 data-key="sec1"></h3>
                    <p data-key="sec1desc"></p>
                </md-card>

                <md-card class="feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="9" y="3" width="6" height="5" rx="1"/>
                            <rect x="3" y="16" width="6" height="5" rx="1"/>
                            <rect x="15" y="16" width="6" height="5" rx="1"/>
                            <path d="M12 8v4"/>
                            <path d="M6 16v-2h12v2"/>
                        </svg>
                    </div>
                    <h3 data-key="sec2"></h3>
                    <p data-key="sec2desc"></p>
                </md-card>

                <md-card class="feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4h-1A2.5 2.5 0 0 1 4 12.5v-7Z"/>
                        </svg>
                    </div>
                    <h3 data-key="sec3"></h3>
                    <p data-key="sec3desc"></p>
                </md-card>

                <md-card class="feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v12"/>
                            <path d="m7 10 5 5 5-5"/>
                            <path d="M5 20h14"/>
                        </svg>
                    </div>
                    <h3 data-key="sec4"></h3>
                    <p data-key="sec4desc"></p>
                </md-card>
            </div>

            <div class="hero-actions">
                <md-button
                    class="next-page"
                    data-next="3"
                    variant="outlined"
                    icon="arrow_downward"
                    label="К загрузке">
                </md-button>
            </div>
        </div>
    </section>

    <section class="page-section" data-page="3" aria-label="Download TapChat">
        <div class="section-inner">
            <p class="eyebrow" id="downloadEyebrow">Начать общение</p>
            <h2 id="downloadTitle">Скачать TapChat</h2>
            <p id="downloadSub" class="download-note">Доступно на Android</p>
            <div id="versionDisplay" class="download-version"></div>

            <div class="download-actions">
                <md-button
                    id="downloadBtn"
                    variant="filled"
                    icon="download"
                    label="Скачать APK">
                </md-button>

                <md-button
                    id="backToStart"
                    variant="outlined"
                    icon="arrow_upward"
                    label="В начало">
                </md-button>
            </div>
        </div>

        <div class="footer">© 2026 TapChat</div>
    </section>
</main>

<script type="module">
const translations = {
    ru: {
        subtitle: 'Проще, чем кажется.',
        aboutEyebrow: 'О проекте',
        aboutTitle: 'Что такое TapChat?',
        aboutDesc: 'TapChat — мессенджер для локальных сетей. Общайтесь с теми, кто рядом — без интернета. Отправляйте сообщения, фото и видео, настраивайте профиль и пользуйтесь тёмной темой. Добавьте собеседника по IP-адресу и начинайте общение.',
        featuresEyebrow: 'Особенности',
        why: 'Почему TapChat?',
        sec1: 'Безопасность',
        sec1desc: 'Общение в локальной сети без обязательного подключения к интернету.',
        sec2: 'Локальная сеть',
        sec2desc: 'Связь с устройствами рядом — без центрального сервера.',
        sec3: 'Быстрое общение',
        sec3desc: 'Отправляйте сообщения и медиа по локальной сети.',
        sec4: 'Просто начать',
        sec4desc: 'Добавьте собеседника по IP-адресу и общайтесь.',
        downloadEyebrow: 'Начать общение',
        downloadTitle: 'Скачать TapChat',
        downloadSub: 'Доступно на Android',
        downloadBtn: 'Скачать APK',
        version: 'Версия ',
        next: 'Узнать больше',
        featuresNext: 'Особенности',
        downloadNext: 'К загрузке',
        dark: 'Тёмная тема',
        light: 'Светлая тема',
        backToStart: 'В начало'
    },
    en: {
        subtitle: 'Easier than it sounds.',
        aboutEyebrow: 'About the project',
        aboutTitle: 'What is TapChat?',
        aboutDesc: 'TapChat is a local network messenger. Chat with people nearby — no internet required. Send messages, photos and videos, customize your profile, and use dark theme. Add a contact by IP address and start chatting.',
        featuresEyebrow: 'Features',
        why: 'Why TapChat?',
        sec1: 'Privacy-minded',
        sec1desc: 'Chat on a local network without requiring an internet connection.',
        sec2: 'Local network',
        sec2desc: 'Connect with nearby devices without a central server.',
        sec3: 'Fast messaging',
        sec3desc: 'Send messages and media over your local network.',
        sec4: 'Easy to start',
        sec4desc: 'Add a contact by IP address and start chatting.',
        downloadEyebrow: 'Start chatting',
        downloadTitle: 'Download TapChat',
        downloadSub: 'Available on Android',
        downloadBtn: 'Download APK',
        version: 'Version ',
        next: 'Discover more',
        featuresNext: 'Features',
        downloadNext: 'Download',
        dark: 'Dark theme',
        light: 'Light theme',
        backToStart: 'Back to start'
    }
};

let lang = localStorage.getItem('tapchat-lang') || 'ru';
let dark = localStorage.getItem('tapchat-theme') === 'dark';

const root = document.documentElement;
const themeEl = document.getElementById('m3eTheme');
const scroller = document.getElementById('scroller');
const sections = [...document.querySelectorAll('.page-section')];

let current = 0;
let locked = false;
let version = '';

function setTheme() {
    root.dataset.theme = dark ? 'dark' : 'light';
    themeEl.setAttribute('color-mode', dark ? 'dark' : 'light');

    document.getElementById('themeToggle').setAttribute(
        'label',
        dark ? translations[lang].light : translations[lang].dark
    );

    document.getElementById('themeToggle').setAttribute(
        'icon',
        dark ? 'light_mode' : 'dark_mode'
    );

    localStorage.setItem('tapchat-theme', dark ? 'dark' : 'light');
}

function updateVersion() {
    document.getElementById('versionDisplay').textContent =
        version ? translations[lang].version + version : '';
}

function setLang(next) {
    lang = next;
    localStorage.setItem('tapchat-lang', lang);
    document.documentElement.lang = lang;

    const t = translations[lang];

    const textIds = [
        'subtitle',
        'aboutEyebrow',
        'aboutTitle',
        'aboutDesc',
        'featuresEyebrow',
        'why',
        'downloadEyebrow',
        'downloadTitle',
        'downloadSub'
    ];

    for (const id of textIds) {
        const element = document.getElementById(id);
        if (element) element.textContent = t[id];
    }

    document.querySelectorAll('[data-key]').forEach(element => {
        element.textContent = t[element.dataset.key];
    });

    const labels = [
        ['#heroNext', 'next'],
        ['[data-next="2"]', 'featuresNext'],
        ['[data-next="3"]', 'downloadNext'],
        ['#downloadBtn', 'downloadBtn'],
        ['#backToStart', 'backToStart']
    ];

    for (const [selector, key] of labels) {
        document.querySelector(selector)?.setAttribute('label', t[key]);
    }

    document.getElementById('langRu').setAttribute(
        'variant',
        lang === 'ru' ? 'filled' : 'text'
    );

    document.getElementById('langEn').setAttribute(
        'variant',
        lang === 'en' ? 'filled' : 'text'
    );

    setTheme();
    updateVersion();
}

function goTo(index, force = false) {
    const next = Math.max(0, Math.min(sections.length - 1, index));

    if (!force && (next === current || locked)) return;

    locked = true;
    current = next;

    sections.forEach((section, index) => {
        section.classList.toggle('active', index === current);
    });

    scroller.scrollTo({
        top: sections[next].offsetTop,
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 'auto'
            : 'smooth'
    });

    window.setTimeout(() => {
        locked = false;
    }, 850);
}

document.getElementById('langRu').addEventListener('click', () => {
    setLang('ru');
});

document.getElementById('langEn').addEventListener('click', () => {
    setLang('en');
});

document.getElementById('themeToggle').addEventListener('click', () => {
    dark = !dark;
    setTheme();
});

/*
 * Колесо сначала прокручивает текущую секцию.
 * Если секция уже у края, переходим к соседней.
 */
scroller.addEventListener('wheel', event => {
    const section = sections[current];
    if (!section) return;

    const delta = Math.abs(event.deltaY) > Math.abs(event.deltaX)
        ? event.deltaY
        : event.deltaX;

    if (Math.abs(delta) < 12) return;

    const maxScroll = section.scrollHeight - section.clientHeight;
    const atBottom = section.scrollTop >= maxScroll - 2;
    const atTop = section.scrollTop <= 2;

    if (delta > 0 && !atBottom) {
        return; // Обычная прокрутка содержимого секции
    }

    if (delta < 0 && !atTop) {
        return; // Обычная прокрутка содержимого секции
    }

    event.preventDefault();
    goTo(current + (delta > 0 ? 1 : -1));
}, { passive: false });

/*
 * На сенсорном экране секция сначала прокручивается нативно.
 * Переход срабатывает, если свайп начался, когда секция уже
 * находилась у верхней или нижней границы.
 */
let touchStartY = null;
let touchStartSection = null;
let touchStartedAtTop = false;
let touchStartedAtBottom = false;

scroller.addEventListener('touchstart', event => {
    const section = sections[current];
    if (!section) return;

    touchStartY = event.touches[0].clientY;
    touchStartSection = section;

    const maxScroll = section.scrollHeight - section.clientHeight;
    touchStartedAtTop = section.scrollTop <= 2;
    touchStartedAtBottom = section.scrollTop >= maxScroll - 2;
}, { passive: true });

scroller.addEventListener('touchend', event => {
    if (touchStartY === null || !touchStartSection) return;

    const delta = touchStartY - event.changedTouches[0].clientY;
    const distanceThreshold = 45;

    if (Math.abs(delta) >= distanceThreshold) {
        if (delta > 0 && touchStartedAtBottom) {
            goTo(current + 1);
        } else if (delta < 0 && touchStartedAtTop) {
            goTo(current - 1);
        }
    }

    touchStartY = null;
    touchStartSection = null;
    touchStartedAtTop = false;
    touchStartedAtBottom = false;
}, { passive: true });

window.addEventListener('keydown', event => {
    if (['ArrowDown', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        goTo(current + 1);
    } else if (['ArrowUp', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        goTo(current - 1);
    } else if (event.key === 'Home') {
        event.preventDefault();
        goTo(0);
    } else if (event.key === 'End') {
        event.preventDefault();
        goTo(sections.length - 1);
    }
});

document.getElementById('heroNext').addEventListener('click', () => {
    goTo(1);
});

document.querySelectorAll('.next-page').forEach(element => {
    element.addEventListener('click', () => {
        goTo(Number(element.dataset.next));
    });
});

document.getElementById('backToStart').addEventListener('click', () => {
    goTo(0, true);
});

fetch('version.json?_=' + Date.now())
    .then(response => {
        if (!response.ok) throw new Error(response.status);
        return response.json();
    })
    .then(data => {
        version = data.version || '';
        updateVersion();

        if (data.url) {
            document.getElementById('downloadBtn').addEventListener('click', () => {
                const link = document.createElement('a');
                link.href = data.url;
                link.download = data.url.split('/').pop() || 'TapChat.apk';
                document.body.appendChild(link);
                link.click();
                link.remove();
            });
        }
    })
    .catch(() => {
        console.info('version.json unavailable; add it beside index.html');
    });

setLang(lang);

function showPageAfterM3ELoaded() {
    document.body.classList.add('theme-ready');
}

customElements.whenDefined('md-expressive-theme').then(() => {
    requestAnimationFrame(() => {
        requestAnimationFrame(showPageAfterM3ELoaded);
    });
}).catch(showPageAfterM3ELoaded);

setTimeout(showPageAfterM3ELoaded, 3000);
</script>
</body>
</html>
